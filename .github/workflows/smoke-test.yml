# CGV 직접 조회가 지금 되는지, 실제 클라이언트 그대로 확인한다.
# 주의: 예전 판은 User-Agent 만 보내서 늘 403 이 났다. 9월에 추가한
# BROWSER_HINTS(sec-ch-ua / Sec-Fetch) 를 빠뜨렸기 때문이다. 그래서
# "차단됨"으로 보였을 뿐 실제 감시기의 상태가 아니었다.
# 이제 cgv_api 의 함수를 그대로 호출한다.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 직접 조회 상태 확인
        run: |
          python - <<'PY'
          import datetime
          import cgv_api

          DAEGU = "0345"
          TODAY = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          TARGET = "20261216"

          print("UA        :", cgv_api.UA[:70])
          print("추가 헤더 :", ", ".join(sorted(cgv_api.BROWSER_HINTS)))
          print()

          def tryit(label, fn):
              try:
                  out = fn()
              except Exception as e:
                  print(f"{label:30} 실패  {type(e).__name__}: {str(e)[:160]}")
                  return None
              print(f"{label:30} OK    {str(out)[:260]}")
              return out

          tryit("1 지역 목록", cgv_api.get_regions)
          tryit("2 대구 특별관", lambda: cgv_api.get_special_screens(DAEGU))
          tryit("3 대구 열린 날짜", lambda: cgv_api.get_open_dates(DAEGU))
          tryit(f"4 대구 시간표 {TODAY}", lambda: cgv_api.get_schedules(DAEGU, TODAY))
          tryit(f"5 대구 시간표 {TARGET}", lambda: cgv_api.get_schedules(DAEGU, TARGET))

          # 6-8 은 200 여부만이 아니라 내용도 찍는다. 필터가 실제로 걸리는지,
          # 공고 목록이 잘려 오는지는 건수로만 알 수 있다.
          full = tryit("6 전체 예매 목록", cgv_api.get_now_playing)
          if full is not None:
              print(f"{'':30} 건수 {len(full)}")
          scx = tryit("7 SCREENX(08) 예매 목록",
                      lambda: cgv_api.get_format_listing("08"))
          if scx is not None:
              print(f"{'':30} 건수 {len(scx)}")
              if full is not None:
                  full_nos = {m.get("movNo") for m in full}
                  scx_nos = {m.get("movNo") for m in scx}
                  print(f"{'':30} 전체의 진부분집합 {scx_nos < full_nos}")
          ev = tryit("8 공고 목록 300건", lambda: cgv_api.get_event_list(300))
          if ev is not None:
              posts, total = ev
              print(f"{'':30} 받은 건수 {len(posts)} / totalCount {total}")
              for p in posts:
                  if "어벤져스" in str(p.get("evntNm") or ""):
                      print(f"{'':30} 어벤져스 글: {p.get('evntNo')} {p.get('evntNm')}")

          print("\n확인 끝. 사실만 기록하고 실패로 끝내지 않는다.")
          PY

      - name: 감시기 전체를 실제 CGV 로 1회 돌려보기 (알림 전송 없음)
        run: python watcher.py --dry-run
